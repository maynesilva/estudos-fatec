<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Sensores</title>
</head>
<body>
    <!--Aula do dia 18/08/26-->
    <h3>Exercício 4</h3>
    <!--Crie uma tabela para controlar sensores de uma máquina industrial. Utilize as colunas Sensor, Grandeza, 
Valor, Unidade e Estado. Cadastre pelo menos quatro sensores e utilize um <caption> adequado. -->
    <table>
        <caption>Controle de Sensores</caption>

        <thead>
            <th scope="col">Sensor</th>
            <th scope="col">Grandeza</th>
            <th scope="col">Valor</th>
            <th scope="col">Unidade</th>
            <th scope="col">Estado</th>
        </thead>
        <tbody>
            <tr>
                <td>S01</td>
                <td>Temperatura</td>
                <td>38</td>
                <td>*C</td>
                <td>Normal</td>
            </tr>
            <tr>
                <td>S02</td>
                <td>Pressão</td>
                <td>7,2</td>
                <td>bar</td>
                <td>Normal</td>
            </tr>
            <tr>
                <td>S03</td>
                <td>Vibração</td>
                <td>12</td>
                <td>mm/s</td>
                <td>Alerta</td>
            </tr>
            <tr>
                <td>S04</td>
                <td>Rotação</td>
                <td>1750</td>
                <td>rpm</td>
                <td>Normal</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
