<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Produtos</title>
</head>
<body>
    <!--Aula do dia 18/08/26-->
    <!--Crie uma página HTML contendo uma tabela com as colunas Código, Produto, Quantidade e Preço. 
Cadastre pelo menos cinco produtos. Utilize <table>, <caption>, <thead>, <tbody>, <tr>, <th> e <td>. -->

    <table>
        <h3>Exercício 1</h3>
        <caption>Tabela de Produtos</caption>

        <thead>
            <tr>
                <th>Código</th>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>0001</td>
                <td>Lápis</td>
                <td>50</td>
                <td>R$2,50</td>
            </tr>

            <tr>
                <td>0002</td>
                <td>Caneta</td>
                <td>30</td>
                <td>R$3,00</td>
            </tr>

            <tr>
                <td>0003</td>
                <td>Caderno</td>
                <td>15</td>
                <td>R$40,00</td>
            </tr>
            <tr>
                <td>0004</td>
                <td>Pasta</td>
                <td>30</td>
                <td>R$1,90</td>
            </tr>
            <tr>
                <td>0005</td>
                <td>Borracha</td>
                <td>40</td>
                <td>R$1,50</td>
            </tr>
        </tbody>

    </table>
</body>
</html>
