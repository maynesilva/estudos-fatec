<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Produtos</title>
</head>
 <!--Aula do dia 18/08-->
<body>
    <h1>Produtos</h1>
    <table> 
        <caption>Estoque de Produtos</caption>
        <thead>
            <tr>
                <th scope="col">Produto</th> <!--Cabeçalho das colunas-->
                <th scope="col">Quantidade</th>
                <th scope="col">Preço</th>
            </tr>
        </thead>
        <tbody>
            <tr> <!--Linha-->
                <td>Teclado</td> <!--Colunas/table data-->
                <td>10</td>
                <td>80.00</td>
            </tr>
            <tr>
                <td>Mouse</td>
                <td>15</td>
                <td>45.00</td>
            </tr>
            <tr>
                <td>Monitor</td>
                <td>5</td>
                <td>900.00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td>25</td>
                <td>---</td>
            </tr>

            <tr>
                <td colspan="3">Totalização geral dos produtos</td>
            </tr>
        </tfoot>
    </table>
    <br> <hr>

    <table>
        <tr> <!--colspan unifica colunas-->
            <th colspan="3">Relatório de Produtos</th>
        </tr>
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
        </tr>
        <tr>
            <td>Teclado</td>
            <td>10</td>
            <td>R$80,00</td>
        </tr>
    </table>
    <br> <hr>

    <table>
        <tr>
            <th>Laboratório</th>
            <th>Disciplina</th>
        </tr>
        <tr> <!--rowspan unifica linhas-->
            <td rowspan="2">Laboratório 1</td>
            <td>HTML</td>
        </tr>
        <tr>
            <td>JAVA</td>
        </tr>
    </table>  

</body>
</html>
