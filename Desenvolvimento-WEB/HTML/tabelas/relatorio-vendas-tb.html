<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Vendas</title>
</head>
<body>
    <!--Aula do dia 18/08/26-->
   <h3>Exercício 5</h3>
    <!--Crie uma tabela de relatório de vendas com três colunas: Produto, Janeiro e Fevereiro. Na primeira linha, 
o texto “Relatório de Vendas” deverá ocupar as três colunas usando colspan="3".-->
    <table>
        <thead>
            <tr>
                <th colspan="3">Relatório de Vendas</th>
            </tr>
            <tr>
                <th scope="col">Produto</th>
                <th scope="col">Janeiro</th>
                <th scope="col">Fevereiro</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Lápis</td>
                <td>500</td>
                <td>1500</td>
            </tr>
            <tr>
                <td>Caneta</td>
                <td>650</td>
                <td>2450</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
