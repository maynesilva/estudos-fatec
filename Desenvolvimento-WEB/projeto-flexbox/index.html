<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tech Store</h1>

        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Produtos</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
    <section class="apresentacao">
        <div>
            <h2>Tecnologia para estudar e criar</h2>
            <p>Conheça alguns produtos disponíveis em nossa loja.</p>
        </div>
    </section>
    
    <section class="produtos">
        <div class="card">
          <img src="notebook.jpg" alt="Notebook">
            <h3>Notebook</h3>
            <p>Ideal para programação e estudos</p>
            <button>Detalhes</button>
        </div>

        <div class="card">
            <img src="mouse.webp" alt="Mouse">
            <h3>Mouse</h3>
            <p>Mouse sem fio para o dia a dia</p>
            <button>Detalhes</button>
        </div>

        <div class="card">
            <img src="teclado.webp" alt="Teclado">
            <h3>Teclado</h3>
            <p>Teclado confortável para digitação</p>
            <button>Detalhes</button>
        </div>
    </section>
    </main>
</body>
</html>
